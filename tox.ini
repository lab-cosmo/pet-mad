[tox]
min_version = 4.0
requires =
    tox>=4.31 
# these are the default environments, i.e. the list of tests running when you
# execute `tox` in the command-line without anything else
envlist =
    lint
    build
    core-tests
    ase-tests
    ase-dos-tests
    ase-explore-tests
    nvalchemi-tests

[testenv]
passenv = *
# defaults shared by all the test suites below; the lint/format/build/docs
# environments override both of these with their own
deps = pytest
commands = pytest {posargs}
lint_folders =
    "{toxinidir}/docs/src/" \
    "{toxinidir}/examples/" \
    "{toxinidir}/src/" \
    "{toxinidir}/tests/"

[testenv:lint]
description = Run linters and type checks
package = skip
deps =
    ruff
    mypy
    sphinx-lint
commands =
    ruff format --diff {[testenv]lint_folders}
    ruff check {[testenv]lint_folders}
    mypy {[testenv]lint_folders}
    sphinx-lint \
        --enable all \
        --disable line-too-long \
        -i "{toxinidir}/docs/src/generated_examples" \
        {[testenv]lint_folders} "{toxinidir}/README.md"

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps = ruff
commands =
    ruff format {[testenv]lint_folders}
    ruff check --fix-only {[testenv]lint_folders} "{toxinidir}/README.md" {posargs}

# --------------------------------------------------------------------------- #
# Test suites, one per source sub-package (see `src/upet/`)
# --------------------------------------------------------------------------- #

[testenv:core-tests]
description = Run the backend-agnostic tests (model registry, metadata, shims)
changedir = tests/core

[testenv:ase-tests]
description = Run the ASE calculator tests (`upet.ase`)
changedir = tests/ase
# `dos` and `explore` have their own environments below
commands = pytest --ignore=dos --ignore=explore {posargs}

[testenv:ase-dos-tests]
description = Run the PET-MAD-DOS tests (`upet.ase.dos`)
changedir = tests/ase/dos

[testenv:ase-explore-tests]
description = Run the PET-MAD explorer tests (`upet.ase.explore`)
changedir = tests/ase/explore

[testenv:nvalchemi-tests]
description = Run the NVAlchemi wrapper tests (`upet.nvalchemi`)
extras = nvalchemi
changedir = tests/nvalchemi

[testenv:{core,ase,ase-dos,ase-explore}-tests-dev]
description = Run the matching test suite against the metatrain dev version
changedir =
    core: tests/core
    dos: tests/ase/dos
    explore: tests/ase/explore
    ase-!dos-!explore: tests/ase
commands_pre =
    pip install "metatrain @ git+https://github.com/metatensor/metatrain.git"
commands =
    ase-!dos-!explore: pytest --ignore=dos --ignore=explore {posargs}
    !ase: pytest {posargs}
    dos: pytest {posargs}
    explore: pytest {posargs}

# --------------------------------------------------------------------------- #

[testenv:build]
description = builds the package and checks integrity
usedevelop = true
deps =
    build
    check-manifest
    twine
allowlist_externals = rm
commands_pre =
    rm -f {toxinidir}/dist/*.whl
    rm -f {toxinidir}/dist/*.tar.gz
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest {toxinidir}

[testenv:docs]
description = builds the documentation with sphinx
deps =
    -r docs/requirements.txt
commands =
    sphinx-build \
        {posargs:-E} \
        --builder html \
        --doctree-dir docs/build/doctree \
        --fail-on-warning \
        docs/src docs/build/html
