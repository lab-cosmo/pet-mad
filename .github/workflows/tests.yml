name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR

jobs:
  tests:
    name: ${{ matrix.suite }} (${{ matrix.os }}, py${{ matrix.python-version }})

    strategy:
      # a broken backend should not hide the state of the others
      fail-fast: false
      matrix:
        include:
          # the ASE calculator is the main entry point, and is the only suite
          # covered on every supported OS / Python combination
          - {suite: ase-tests, os: ubuntu-24.04, python-version: "3.11"}
          - {suite: ase-tests, os: ubuntu-24.04, python-version: "3.13"}
          - {suite: ase-tests, os: macos-15, python-version: "3.13"}
          - {suite: ase-tests, os: windows-2022, python-version: "3.13"}
          # the remaining suites run once, to keep the number of checkpoints
          # downloaded from HuggingFace reasonable
          - {suite: core-tests, os: ubuntu-24.04, python-version: "3.13"}
          - {suite: ase-dos-tests, os: ubuntu-24.04, python-version: "3.13"}
          - {suite: ase-explore-tests, os: ubuntu-24.04, python-version: "3.13"}
          - {suite: nvalchemi-tests, os: ubuntu-24.04, python-version: "3.13"}

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip install tox

    - name: run Python tests
      run: tox -e ${{ matrix.suite }}
      env:
        # Use the CPU only version of torch when building/running the code
        PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
