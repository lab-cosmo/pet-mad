name: Tests dev

on:
  schedule:
    # check once a week on mondays
    - cron: '0 10 * * 1'

jobs:
  tests-dev:
    name: ${{ matrix.suite }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: ase-tests-dev, python-version: "3.11"}
          - {suite: ase-tests-dev, python-version: "3.13"}
          - {suite: core-tests-dev, python-version: "3.13"}
          - {suite: ase-dos-tests-dev, python-version: "3.13"}
          - {suite: ase-explore-tests-dev, python-version: "3.13"}
          # `nvalchemi-tests` is left out on purpose: combining the metatrain
          # and nvalchemi-toolkit development versions makes failures hard to
          # attribute to either one

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tests dependencies
      run: python -m pip install tox

    - name: run Python tests
      run: tox -e ${{ matrix.suite }}
      env:
        # Use the CPU only version of torch when building/running the code
        PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
